{% extends 'insurance/adminbase.html' %}
{% load widget_tweaks %}
{% block content %}
<div class="form-card">
  <h3><i class="fas fa-edit"></i> Update Category</h3>
  <form method="post" autocomplete="off">
    {% csrf_token %}
    <label for="category_name">Category Name</label>
    {% render_field categoryForm.category_name class="form-control" %}
    <button type="submit" class="btn btn-primary">Update</button>
  </form>
</div>
{% endblock content %}
