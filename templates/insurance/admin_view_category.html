{% extends 'insurance/adminbase.html' %}
{% block content %}
<div class="panel-card">
  <div class="panel-heading"><h4><i class="fas fa-list-alt"></i> Categories</h4></div>
  <table class="table table-hover mb-0">
    <thead>
      <tr><th>#</th><th>Category Name</th><th>Creation Date</th></tr>
    </thead>
    <tbody>
      {% for t in categories %}
      <tr>
        <td>{{ forloop.counter }}</td>
        <td>{{ t.category_name }}</td>
        <td>{{ t.creation_date }}</td>
      </tr>
      {% empty %}
      <tr><td colspan="3" class="text-center text-muted">No categories yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock content %}
