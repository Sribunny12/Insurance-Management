{% extends 'insurance/adminbase.html' %}
{% load widget_tweaks %}
{% block content %}
<div class="form-card">
  <h2><i class="fas fa-plus"></i> Add Category</h2>
  <form method="POST" autocomplete="off">
    {% csrf_token %}
    <label for="category_name">Category Name</label>
    {% render_field categoryForm.category_name class="form-control" placeholder="Life Insurance" %}
    <button type="submit" class="btn btn-primary">Add</button>
  </form>
</div>
{% endblock content %}
