{% extends 'customer/customerbase.html' %}
{% block content %}
<div class="panel-card">
  <div class="panel-heading"><h4><i class="fas fa-history"></i> My Policy History</h4></div>
  <table class="table table-hover mb-0">
    <thead>
      <tr><th>#</th><th>Policy Name</th><th>Applied Date</th><th>Status</th></tr>
    </thead>
    <tbody>
      {% for t in policies %}
      <tr>
        <td>{{ forloop.counter }}</td>
        <td>{{ t.Policy }}</td>
        <td>{{ t.creation_date }}</td>
        <td><span class="status-pill status-{{ t.status }}">{{ t.status }}</span></td>
      </tr>
      {% empty %}
      <tr><td colspan="4" class="text-center text-muted">You haven't applied for any policy yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock content %}
